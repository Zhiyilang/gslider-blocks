# .github/labeler.yml
# Configuration for actions/labeler@v7 in GSlider Blocks

'focus: php-backend':
  - changed-files:
      - any-glob-to-any-file:
          - 'includes/**/*.php'
          - 'gslider-blocks.php'
          - 'tests/phpunit/**/*'

'focus: blocks':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/blocks/**/*'
          - 'build/blocks/**/*'

'focus: design-system':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/**/*'

'focus: swiper-engine':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/blocks/*/view.js'
          - 'src/blocks/*/edit.js'
          - 'assets/vendors/swiper/**/*'

'focus: headless':
  - changed-files:
      - any-glob-to-any-file:
          - 'includes/RestApi/**/*'
          - 'tests/phpunit/RestApi/**/*'

'focus: mcp':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/mcp-server/**/*'

'focus: ci-cd':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'webpack*.js'
          - 'package*.json'
          - 'composer*.json'

'focus: accessibility':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*a11y*'
          - '**/*aria*'

'focus: i18n':
  - changed-files:
      - any-glob-to-any-file:
          - 'languages/**/*'
          - '**/*.pot'
          - '**/*.po'

'type: documentation':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'
          - '.agents/**/*'
          - 'readme.txt'
