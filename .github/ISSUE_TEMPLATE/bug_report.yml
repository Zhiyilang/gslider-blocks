name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in GSlider Blocks"
title: "bug: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to **GSlider Blocks**! Please provide as much detail as possible to help us reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When inserting the slider block on mobile..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Insert 'Image Slider' block.
        2. Set columns to 3 on Mobile.
        3. View frontend...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: dropdown
    id: affected_block
    attributes:
      label: "Affected Block"
      options:
        - "Image Slider"
        - "Base Slider"
        - "Testimonial Slider"
        - "Logo Carousel"
        - "Flexi Content"
        - "Core Plugin / General"
    validations:
      required: true

  - type: input
    id: wp_version
    attributes:
      label: "WordPress Version"
      placeholder: "e.g. 6.7"
    validations:
      required: false

  - type: input
    id: php_version
    attributes:
      label: "PHP Version"
      placeholder: "e.g. 8.2"
    validations:
      required: false
