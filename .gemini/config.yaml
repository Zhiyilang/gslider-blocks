have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: 15
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false
ignore_patterns:
  - "storybook/**"
  - "docs/**"
  - "vendor/**"
  - "node_modules/**"
  - "build/**"
  - "languages/**"
  - "assets/admin/**"
  - "packages/mcp-server/dist/**"
  - "includes/RestApi/defaults/**"
  - "package-lock.json"
  - "composer.lock"
  - "**/*.zip"
